#
# aml.conf
#
# Purpose:  This file is used to tell AML where to get .*ml files and where to put the output.
#		  It also has a few other presets.
#

# The following five variables are set for the location of the AML encoded files.
#

$location_rml = './aml.format/rml';
$location_mml = './aml.format/mml';
$location_oml = './aml.format/oml';
$location_sml = './aml.format/sml';
$location_zml = './aml.format/zml';


# The following five variables are set for the location of the MUD encoded files.
#

$location_wld = './mud.format/wld';
$location_mob = './mud.format/mob';
$location_obj = './mud.format/obj';
$location_shp = './mud.format/shp';
$location_zon = './mud.format/zon';
